<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koodipank // Script Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="badge-top">⚡ PRIVAATNE KOODIPANK</div>
            <h1>Minu Skriptid & Projektid</h1>
            <p class="subtitle">Vali allolevast nimekirjast sobiv skript ja kopeeri see ühe klikiga oma lõikelauale.</p>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <svg class="search-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Otsi skripti nime või kirjelduse järgi...">
            </div>
            <div class="stats-pill" id="stats-pill">
                <span>Kokku: <strong id="total-count">0</strong></span>
                <span>•</span>
                <span>Töötab: <strong id="working-count" class="text-green">0</strong></span>
            </div>
        </div>

        <!-- ADMIN PANEEL (avaneb alles pärast õige parooli kinnitamist serveris) -->
        <div class="admin-panel" id="admin-panel" style="display: none;">
            <h3>➕ Lisa või uuenda skripti</h3>
            <div class="admin-grid">
                <input type="text" id="new-name" placeholder="Skripti nimi (nt Roblox Fly v2)">
                <input type="text" id="new-cat" placeholder="Keel / Kategooria (nt Lua, JavaScript)">
                <input type="text" id="new-file" placeholder="Faili nimi (nt fly-v2.lua)">
                <input type="text" id="new-desc" placeholder="Lühike kirjeldus">
            </div>
            <textarea id="new-code" rows="6" placeholder="Kleebi siia terve skripti kood..."></textarea>
            <button class="btn copy-btn" id="post-script-btn" style="width: 100%; margin-top: 10px;">
                <span>Postita skript lehele</span>
            </button>
        </div>

        <div class="container" id="script-list"></div>

        <footer>
            Kõik failid legit • Sigma Kirk
            <span id="admin-toggle" title="Admin režiim" style="cursor:pointer; margin-left:8px; opacity:0.6;">🔒</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
